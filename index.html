<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 Presigned URL Uploader</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #111;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        #fileSelectorContainer {
            display: none; /* Hidden by default */
            padding: 15px;
            background: #eef2f7;
            border-radius: 4px;
            border-left: 4px solid #0066cc;
        }
        .hint {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-weight: 500;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

<div class="card">
    <h2>S3 Target Upload</h2>
    
    <!-- Step 1: URL input -->
    <div class="form-group">
        <label for="urlInput">1. Paste Presigned PUT URL</label>
        <input type="text" id="urlInput" placeholder="https://amazonaws.com..." autocomplete="off">
    </div>

    <!-- Step 2: File Selector (Hidden by default) -->
    <div id="fileSelectorContainer" class="form-group">
        <label for="fileInput">2. Select Your File</label>
        <div class="hint" id="fileHint">Please select a file.</div>
        <input type="file" id="fileInput">
    </div>

    <!-- Step 3: Action button -->
    <button id="uploadBtn" disabled>Upload File</button>

    <!-- Status reporting UI -->
    <div id="status"></div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const fileSelectorContainer = document.getElementById('fileSelectorContainer');
    const fileInput = document.getElementById('fileInput');
    const fileHint = document.getElementById('fileHint');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');

    let expectedFileName = "";

    // Monitor input modifications (paste/type)
    urlInput.addEventListener('input', handleUrlInput);

    function handleUrlInput() {
        const urlText = urlInput.value.trim();
        showStatus(''); // Reset status alerts

        if (!urlText) {
            resetForm();
            return;
        }

        try {
            const urlObj = new URL(urlText);
            const decodedPath = decodeURIComponent(urlObj.pathname);
            
            // Extract the final segment of the path (the filename)
            const filename = decodedPath.substring(decodedPath.lastIndexOf('/') + 1);

            if (filename && filename !== "/") {
                expectedFileName = filename;
                
                // DYNAMIC FILTERING: Force the OS file chooser to look for this exact filename
                fileInput.setAttribute('accept', `.${filename.split('.').pop()}, ${filename}`);
                
                // Show file selector and configure dynamic text encouragement
                fileSelectorContainer.style.display = 'block'; // FIXED: Removed duplicate .style
                fileHint.innerHTML = `⚠️ This URL requires a file named exactly: <strong style="color:#c00;">${expectedFileName}</strong><br><small style="color: #666;">(Your file browser has been filtered to help find it)</small>`;
                
                // Evaluate button state if a file was already loaded
                validateFileSelection();
            } else {
                throw new Error("Could not find a valid file target name in the URL path.");
            }
        } catch (e) {
            fileSelectorContainer.style.display = 'none';
            uploadBtn.disabled = true;
            showStatus('Invalid URL layout or missing target file name in parameters.', 'error');
        }
    }

    // Monitor file picking changes
    fileInput.addEventListener('change', validateFileSelection);

    function validateFileSelection() {
        const file = fileInput.files[0]; // FIXED: Access the file object correctly
        showStatus('');

        if (!file) {
            uploadBtn.disabled = true;
            return;
        }

        // Strict name enforcement backup check
        if (file.name !== expectedFileName) {
            showStatus(`Name mismatch! Picked "${file.name}" but expected "${expectedFileName}".`, 'error');
            uploadBtn.disabled = true;
        } else {
            showStatus(`Valid file selected! Ready to upload.`, 'info');
            uploadBtn.disabled = false;
        }
    }

    // Trigger standard fetch PUT request
    uploadBtn.addEventListener('click', async () => {
        const file = fileInput.files[0]; // FIXED: Access the file object correctly
        const uploadUrl = urlInput.value.trim();

        if (!file || file.name !== expectedFileName) return;

        try {
            uploadBtn.disabled = true;
            showStatus('Uploading file directly to destination...', 'info');

            const response = await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: {
                    'Content-Type': file.type || 'application/octet-stream'
                }
            });

            if (response.ok) {
                showStatus('Success! File uploaded successfully.', 'success');
            } else {
                showStatus(`Upload failed with server status code: ${response.status} (${response.statusText})`, 'error');
                uploadBtn.disabled = false;
            }
        } catch (error) {
            showStatus(`Network Error: ${error.message}. Check CORS settings on your destination bucket.`, 'error');
            uploadBtn.disabled = false;
        }
    });

    function resetForm() {
        fileSelectorContainer.style.display = 'none';
        fileInput.value = '';
        fileInput.removeAttribute('accept');
        uploadBtn.disabled = true;
        expectedFileName = "";
    }

    function showStatus(message, type) {
        if (!message) {
            statusDiv.style.display = 'none';
            return;
        }
        statusDiv.className = type;
        statusDiv.textContent = message;
        statusDiv.style.display = 'block';
    }
</script>

</body>
</html>
