<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presigned URL Uploader to Block Storage (S3,Tigris,R2,etc.) - Web Based simply & free.</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #363636;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        #fileSelectorContainer {
            display: none; padding: 15px; background: #eef2f7;
            border-radius: 4px; border-left: 4px solid #0066cc;
        }
        #timerDisplay { font-weight: bold; margin-top: 5px; min-height: 18px; }
        .timer-active { color: #28a745; }
        .timer-warning { color: #dc3545; }
        button {
            background-color: #0066cc; color: white; border: none;
            padding: 12px 20px; border-radius: 4px; cursor: pointer;
            width: 100%; font-weight: bold; font-size: 16px;
        }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #e2e3e5; color: #383d41; }
		
		  #drop-overlay {
		    position: fixed;
		    top: 0;
		    left: 0;
		    width: 100vw;
		    height: 100vh;
		    background: rgba(0, 0, 0, 0.7);
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    color: white;
		    font-size: 2rem;
		    z-index: 9999;
		    opacity: 0;
		    visibility: hidden;
		    pointer-events: none;
		    transition: opacity 0.2s ease, visibility 0.2s ease;
		  }
		  
		  /* Active class when dragging */
		  body.dragging #drop-overlay {
		    opacity: 1;
		    visibility: visible;
		  }
    </style>
</head>
<body>
<!-- Full-screen visual drop indicator (hidden by default) -->
<div id="dropOverlay" class="overlay">
  <div class="drop-message">Drop your file anywhere on the screen!</div>
</div>
	
<div class="card">
    <h2>Upload to a Presigned URL</h2>
    <P>Make sure your bucket allows CORS from *.github.io <BR>(or ask your agent to enable it).</P>
    
    <div class="form-group">
        <label for="urlInput">1. Paste Presigned PUT URL</label>
        <input type="text" id="urlInput" placeholder="https://bucket..." autocomplete="off">
        <div id="timerDisplay"></div>
    </div>

    <div id="fileSelectorContainer" class="form-group">
        <label for="fileInput">2. Select Your File</label>
		
        <div id="fileHint" style="font-size:13px; margin-bottom:8px;"></div>
        <input type="file" id="fileInput">
    </div>

    <button id="uploadBtn" disabled>Upload File</button>
    <div id="status"></div>
</div>

<script>
    const urlInput = document.getElementById('urlInput');
    const fileSelectorContainer = document.getElementById('fileSelectorContainer');
    const fileInput = document.getElementById('fileInput');
    const fileHint = document.getElementById('fileHint');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusDiv = document.getElementById('status');
    const timerDisplay = document.getElementById('timerDisplay');
	const urlParams = new URLSearchParams(window.location.search);
	const url = urlParams.get('url');

    let expectedFileName = "";
    let expirationTime = null;
    let timerInterval = null;

    urlInput.addEventListener('input', handleUrlInput);
    fileInput.addEventListener('change', validateFileSelection);
	if (url) {
		urlInput.value = url;
		urlInput.dispatchEvent(new Event('input'));
	}
		
    function handleUrlInput() {
        const urlText = urlInput.value.trim();
        showStatus(''); 
        clearInterval(timerInterval); 
        timerDisplay.innerHTML = '';

        if (!urlText) {
            resetForm();
            return;
        }

        try {
            const urlObj = new URL(urlText);
            const decodedPath = decodeURIComponent(urlObj.pathname);
            const filename = decodedPath.substring(decodedPath.lastIndexOf('/') + 1);

            if (!filename || filename === "/") throw new Error("Missing filename");
            expectedFileName = filename;

            const amzDate = urlObj.searchParams.get('X-Amz-Date');
            const amzExpires = urlObj.searchParams.get('X-Amz-Expires');

            if (amzDate && amzExpires) {
                if (amzDate.length >= 15) {
                    const year = amzDate.substring(0, 4);
                    const month = amzDate.substring(4, 6);
                    const day = amzDate.substring(6, 8);
                    const hour = amzDate.substring(9, 11);
                    const minute = amzDate.substring(11, 13);
                    const second = amzDate.substring(13, 15);
                    
                    const formattedISO = year + "-" + month + "-" + day + "T" + hour + ":" + minute + ":" + second + "Z";
                    const startTime = new Date(formattedISO).getTime();
                    const duration = parseInt(amzExpires, 10);
                    
                    if (!isNaN(startTime) && !isNaN(duration)) {
                        expirationTime = startTime + (duration * 1000);
                        if (Date.now() >= expirationTime) {
                            handleExpiration();
                            return;
                        }
                        startCountdown();
                    } else {
                        timerDisplay.innerHTML = '<span style="color:#ee7c00; font-size:12px;">ℹ️ Metadata found but failed to convert timestamp parameters.</span>';
                    }
                } else {
                    timerDisplay.innerHTML = '<span style="color:#ee7c00; font-size:12px;">ℹ️ Timestamp length is non-standard.</span>';
                }
            } else {
                timerDisplay.innerHTML = '<span style="color:#666; font-size:12px;">ℹ️ No standard X-Amz-Date expiration metadata found.</span>';
            }

            fileInput.setAttribute('accept', "." + filename.split('.').pop() + ", " + filename);
            fileSelectorContainer.style.display = 'block';
            fileHint.innerHTML = '⚠️ Required file name: <strong style="color:#c00;">' + expectedFileName + '</strong>';
            validateFileSelection();

        } catch (e) {
            fileSelectorContainer.style.display = 'none';
            uploadBtn.disabled = true;
            showStatus('Invalid URL layout or missing target file name in parameters.', 'error');
        }
    }

    function startCountdown() {
        function updateTimer() {
            const timeLeft = expirationTime - Date.now();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleExpiration();
                return;
            }
            const hours = Math.floor(timeLeft / 3600000);
            const mins = Math.floor((timeLeft % 3600000) / 60000);
            const secs = Math.floor((timeLeft % 60000) / 1000);
            const isUrgent = timeLeft < 60000;
            
            let timeString = mins + "m " + secs + "s";
            if (hours > 0) timeString = hours + "h " + timeString;

            timerDisplay.innerHTML = '<span class="' + (isUrgent ? 'timer-warning' : 'timer-active') + '">⏱️ Link valid for: ' + timeString + '</span>';
        }
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function handleExpiration() {
        timerDisplay.innerHTML = '<span class="timer-warning">❌ URL EXPIRED</span>';
        fileSelectorContainer.style.display = 'none';
        uploadBtn.disabled = true;
        showStatus('This presigned URL has expired.', 'error');
    }

    function validateFileSelection() {
        if (!fileInput.files || fileInput.files.length === 0) { 
            uploadBtn.disabled = true; 
            return; 
        }
        
        const file = fileInput.files[0];
        showStatus('');
        
        if (expirationTime && Date.now() >= expirationTime) { 
            handleExpiration(); 
            return; 
        }

        if (file.name !== expectedFileName) {
            showStatus('Name mismatch! Got "' + file.name + '" but expected "' + expectedFileName + '".', 'error');
            uploadBtn.disabled = true;
        } else {
            showStatus('Valid file selected!', 'info');
            uploadBtn.disabled = false;
        }
    }

    uploadBtn.addEventListener('click', async () => {
        if (!fileInput.files || fileInput.files.length === 0) return;
        const file = fileInput.files[0];
        const uploadUrl = urlInput.value.trim();
        
        if (file.name !== expectedFileName) return;
        if (expirationTime && Date.now() >= expirationTime) { handleExpiration(); return; }

        try {
            uploadBtn.disabled = true;
            showStatus('Uploading file...', 'info');
            const response = await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: { 'Content-Type': file.type || 'application/octet-stream' }
            });
            if (response.ok) {
                showStatus('Success! File uploaded successfully.', 'success');
                clearInterval(timerInterval);
                timerDisplay.innerHTML = '<span style="color:#28a745;">✅ Upload Complete</span>';
            } else {
                showStatus('Upload failed: Status ' + response.status, 'error');
                uploadBtn.disabled = false;
            }
        } catch (error) {
            showStatus('Network Error: ' + error.message + '. Check S3 CORS configuration.', 'error');
            uploadBtn.disabled = false;
        }
    });

    function resetForm() {
        fileSelectorContainer.style.display = 'none';
        fileInput.value = '';
        fileInput.removeAttribute('accept');
        uploadBtn.disabled = true;
        expectedFileName = "";
        expirationTime = null;
        clearInterval(timerInterval);
    }

    function showStatus(message, type) {
        if (!message) { statusDiv.style.display = 'none'; return; }
        statusDiv.className = type;
        statusDiv.textContent = message;
        statusDiv.style.display = 'block';
    }



  let counter = 0; // Tracks enter/leave events for child elements

  window.addEventListener('dragenter', (e) => {
    e.preventDefault();
    counter++;
    document.body.classList.add('dragging');
  });

  window.addEventListener('dragleave', (e) => {
    e.preventDefault();
    counter--;
    if (counter === 0) {
      document.body.classList.remove('dragging');
    }
  });

  window.addEventListener('dragover', (e) => {
    e.preventDefault(); // Required to allow dropping
  });

  window.addEventListener('drop', (e) => {
    e.preventDefault();
    counter = 0;
    document.body.classList.remove('dragging');
    
    fileInput.files = e.dataTransfer.files;
    console.log('Dropped files:', files);
	uploadBtn.dispatchEvent(new Event('click'));
	  
  });

	
</script>
</body>
</html>
